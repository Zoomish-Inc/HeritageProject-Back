services:
  web:
    build: .
    env_file: .env
    environment:
      DEBUG: "false"
      ENVIRONMENT: production
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgres://heritage:${POSTGRES_PASSWORD}@db:5432/heritage?sslmode=disable
      TOUR_SYNC_MODE: local
      TOUR_PACKS_ROOT: /data/tour-packs
    volumes:
      - tourpacks:/data/tour-packs
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: heritage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: heritage
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heritage -d heritage"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  tourpacks:
    name: heritage_tourpacks
