name: DB keepalive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping api/app (keeps Render + Aiven awake)
        run: |
          curl -fsS --retry 3 --retry-delay 10 --max-time 120 \
            "https://heritageproject-back.onrender.com/api/app"
